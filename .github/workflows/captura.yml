name: captura

# O AGENDAMENTO SAIU DAQUI em 12/08/2026: quem dispara a captura agora é o
# pg_cron do Supabase (migration 0008), chamando a edge function `captura`.
#
# Motivo: o schedule do GitHub pedia ~48 execuções por dia e entregava 6 a 10.
# Medido em 100 runs entre 23/07 e 12/08 (3 em 12/08, 8 em 11/08, 6 em 10/08,
# 10 em 07/08), todos verdes em 15s com "upsert ok": throttle do lado do GitHub,
# não falha do job. Como `mapa_dia` guarda só o dia corrente, atraso da primeira
# captura = app mostrando salas livres demais e nenhuma aula (em 11/08, das 00:30
# às 07:37 BRT).
#
# Este workflow fica como PLANO B manual: dispara na mão pelo Actions se a
# function ou o pg_cron estiverem fora. `capture/captura.py` segue sendo a
# implementação de referência do parser, e o portão de paridade
# (scripts/paridade-captura.py) exige que os dois devolvam o mesmo payload.
on:
  workflow_dispatch:

concurrency:
  group: captura
  cancel-in-progress: false

jobs:
  captura:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: rodar captura
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python capture/captura.py

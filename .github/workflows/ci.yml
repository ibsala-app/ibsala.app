name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest capture/ -q

  contraste:
    # o dark mode já entregou texto branco sobre azul claro a 3,4:1 (a pill de
    # data) e o eyebrow dourado a 2,40:1 no tema claro; olho nu não pega isso
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/contraste.py

  smoke:
    # o pior defeito de 12/08 (pagina pintada, nenhum botao respondendo) passava
    # em qualquer teste de unidade: so aparece com o DOM renderizado
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # o bump de versao se mede contra origin/main, entao o historico
          # precisa vir junto (mesmo motivo do job gitleaks)
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # HTML, JS, CSS e service worker apontando pro mesmo ?v=. Sem isso o
      # navegador pareia HTML novo com JS de ate 4 horas atras, que foi o
      # IBSALA-F de 12/08
      - run: python scripts/versao.py --base origin/main
      - run: python scripts/smoke.py

  functions:
    # as edge functions nunca passaram por typecheck: o ambiente do Josh nao tem
    # Deno e o CI so rodava Python. Dois erros de tipo estavam em producao no
    # `_shared/webpush.ts` desde 13/08, invisiveis porque o runtime ignora tipo.
    # O `deno test` roda o push-slot em escala de lancamento (1.500 materias)
    # contra um `fetch` de mentira, sem tocar em Supabase nenhum.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/*/index.ts supabase/functions/_shared/*.ts supabase/functions/*/logica.ts
      - run: deno test supabase/functions/

  sql:
    # Os dois furos mais graves do projeto sairam de auditoria manual, em agosto:
    # `alunos_update_own` sem `with check` (qualquer aluno logado virava admin) e
    # as tres `disparar_*` executaveis por `anon`. Nenhum teste do repo olhava
    # pro banco. Este job sobe um Postgres limpo, aplica TODAS as migrations na
    # ordem e cobra RLS, grants e quota com o papel de cada usuario do app.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase db start
      - name: RLS, grants e quotas
        run: |
          for t in supabase/tests/*.sql; do
            echo "== $t"
            psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
              -v ON_ERROR_STOP=1 -f "$t"
          done

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
